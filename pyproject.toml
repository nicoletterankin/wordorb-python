[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordorb"
version = "0.1.0"
description = "Python SDK for the Word Orb language enrichment API — 162K words, 47 languages, lessons, quizzes, and knowledge graphs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lesson of the Day PBC", email = "hello@lotdpbc.com" },
]
keywords = [
    "word-orb",
    "vocabulary",
    "language",
    "education",
    "nlp",
    "linguistics",
    "dictionary",
    "api",
    "enrichment",
    "multilingual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Framework :: Robot Framework :: Library",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://wordorb.ai"
Documentation = "https://wordorb.ai/docs"
Repository = "https://github.com/nicoletterankin/wordorb-python"
Issues = "https://github.com/nicoletterankin/wordorb-python/issues"
Changelog = "https://wordorb.ai/changelog"

[project.scripts]
wordorb = "wordorb.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wordorb"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
